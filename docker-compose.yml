# Ambiente de DESARROLLO. Levanta PostgreSQL y la API juntas.
# La API monta el código del host para trabajar sin reconstruir la imagen.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ncfield
      POSTGRES_PASSWORD: ncfield_dev
      POSTGRES_DB: ncfield_db
    ports: ["5432:5432"]
    volumes: ["dbdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ncfield -d ncfield_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    environment:
      PGHOST: db
      PGUSER: ncfield
      PGPASSWORD: ncfield_dev
      PGDATABASE: ncfield_db
      JWT_SECRET: dev-secret-no-usar-en-produccion
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
    command: sh -c "node seed.js && node server.js"

volumes:
  dbdata:
